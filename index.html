<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Говори́ — Russian practice</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CclipPath id='c'%3E%3Crect x='2' y='10' width='60' height='44' rx='8'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23c)'%3E%3Crect x='2' y='10' width='60' height='15' fill='%23fff'/%3E%3Crect x='2' y='25' width='60' height='15' fill='%230039A6'/%3E%3Crect x='2' y='40' width='60' height='14' fill='%23D52B1E'/%3E%3C/g%3E%3Crect x='2.5' y='10.5' width='59' height='43' rx='7.5' fill='none' stroke='%23000' stroke-opacity='.18'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CclipPath id='c'%3E%3Crect x='2' y='10' width='60' height='44' rx='8'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23c)'%3E%3Crect x='2' y='10' width='60' height='15' fill='%23fff'/%3E%3Crect x='2' y='25' width='60' height='15' fill='%230039A6'/%3E%3Crect x='2' y='40' width='60' height='14' fill='%23D52B1E'/%3E%3C/g%3E%3Crect x='2.5' y='10.5' width='59' height='43' rx='7.5' fill='none' stroke='%23000' stroke-opacity='.18'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@400;700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#1c2230; --muted:#6a6f7c; --line:#e4ded1;
  --accent:#b8402c; --accent-soft:#f6e1da; --blue:#27466e; --blue-soft:#e3eaf3;
  --ok:#2c7a4b; --ok-soft:#dff0e5; --warn:#a86a12; --warn-soft:#f7ecd6; --bad:#b33a3a; --bad-soft:#f6dede;
  --shadow:0 1px 2px rgba(28,34,48,.06),0 4px 14px rgba(28,34,48,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171d;--card:#1c2029;--ink:#ecebe6;--muted:#9aa0ab;--line:#2c313c;
  --accent:#e3765f;--accent-soft:#3a2420;--blue:#8fb2de;--blue-soft:#1f2a3a;
  --ok:#6cc08d;--ok-soft:#1b3326;--warn:#e0a84d;--warn-soft:#352a17;--bad:#e57d7d;--bad-soft:#3a2020;
  --shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 90px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{font-family:"PT Serif",serif;font-weight:700;font-size:22px;letter-spacing:.2px;white-space:nowrap}
.brand .dot{color:var(--accent);font-style:normal}
.brand .bt{font-weight:700}
.brand{display:flex;align-items:center;gap:9px}
.brand .flag{width:30px;height:20px;flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 11px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14.5px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--card)}
nav.tabs a.on{color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px}
h1{font-family:"PT Serif",serif;font-size:30px;line-height:1.2;margin:28px 0 6px}
h2{font-family:"PT Serif",serif;font-size:21px;margin:26px 0 10px}
h3{font-size:16px;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 18px;max-width:680px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
a.btn.pri{color:var(--bg)}
a.btn.acc{color:#fff}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.ru{font-family:"PT Serif",serif}
.sv{color:var(--accent)}
.ph{color:var(--blue);font-size:14.5px}
.ph b{font-weight:700}
.en{color:var(--muted);font-size:14.5px}
.note{font-size:13.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:5px 9px;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.hide-ph .ph{display:none}
.notice{border-radius:12px;padding:11px 14px;font-size:14.5px;background:var(--blue-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--blue) 30%,transparent)}
.notice.w{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat .n{font-size:30px;font-weight:700;font-family:"PT Serif",serif}
.stat .l{color:var(--muted);font-size:13.5px}
.go{display:block;text-decoration:none;color:inherit}
.go:hover{border-color:var(--muted)}
.go .k{font-family:"PT Serif",serif;font-size:26px;color:var(--accent)}
/* alphabet */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.lt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;text-align:center;position:relative}
.lt:hover{border-color:var(--muted)}
.lt .L{font-family:"PT Serif",serif;font-size:30px;line-height:1.1}
.lt .s{font-size:12.5px;color:var(--muted)}
.lt.known::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.ghead{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.ghead h3{margin:0}
/* phrase cards */
.pc .ru{font-size:21px;line-height:1.3}
.pc .acts{margin-top:10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,12,18,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 14px;overflow:auto}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:18px;max-width:560px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative}
.sheet .x{position:absolute;top:12px;right:12px;border:none;background:none;font-size:22px;color:var(--muted)}
.big{font-family:"PT Serif",serif;font-size:42px;line-height:1.15;margin:4px 0}
.cursive{font-family:"Marck Script",cursive}
.result{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:14.5px}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--warn-soft);color:var(--warn)}
.result.low{background:var(--bad-soft);color:var(--bad)}
.heard .w-ok{color:var(--ok);font-weight:600}
.heard .w-no{color:var(--bad);text-decoration:underline wavy}
/* quiz */
.qbig{font-family:"PT Serif",serif;font-size:56px;text-align:center;margin:10px 0 4px;line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:16px;text-align:center}
.opt:hover{border-color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* dialogue */
.line{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.line .who{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--blue-soft);color:var(--blue)}
.line.me .who{background:var(--accent-soft);color:var(--accent)}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;flex:1}
.bubble .ru{font-size:19px}
.line.cur .bubble{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.masked{filter:blur(7px);user-select:none}
/* write */
.canvas-wrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
canvas{display:block;width:100%;touch-action:none}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
.strip button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;font-family:"PT Serif",serif;font-size:18px}
.strip button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dict-in{width:100%;font-family:"PT Serif",serif;font-size:28px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.dict-in:focus{border-color:var(--blue)}
.kb{margin-top:12px;display:flex;flex-direction:column;gap:5px;align-items:center}
.kb .r{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap}
.kb button{width:clamp(24px,7.4vw,44px);height:44px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-family:"PT Serif",serif;font-size:18px;position:relative;padding:0}
.kb button small{position:absolute;bottom:1px;right:3px;font-family:"Golos Text";font-size:9px;color:var(--muted)}
.kb button.wide{width:auto;padding:0 14px;font-family:"Golos Text";font-size:14px}
.diff .d-ok{color:var(--ok)} .diff .d-no{color:var(--bad);background:var(--bad-soft);border-radius:3px}
/* rule */
.rule .ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.exb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;text-align:left}
.exb .ru{font-size:17px}
.exb .ph{font-size:13px;display:block}
.exb .en{font-size:12.5px;display:block}
.go.done{border-color:var(--ok);background:var(--ok-soft)}
.pc.done{border-color:var(--ok);background:var(--ok-soft)}
.pc .dn{display:none;float:right;color:var(--ok);font-weight:600;font-size:13px}
.pc.done .dn{display:inline}
.go .gl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.go.done .gl b{color:var(--ok)}
.meter{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--blue);border-radius:6px}
.go.done .meter i{background:var(--ok)}
.stat.done{border-color:var(--ok);background:var(--ok-soft)}
.stat.done .n{color:var(--ok)}
table.sk{width:100%;border-collapse:collapse;font-size:14.5px}
table.sk th{text-align:right;font-weight:500;color:var(--muted);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.sk th:first-child,table.sk td:first-child{text-align:left}
table.sk td{text-align:right;padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.sk tr:last-child td{border-bottom:none}
table.sk .na{color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--blue);pointer-events:none}
.chart .hit:hover+.bar,.chart .bar.hl{fill:var(--accent)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;line-height:1.4}
.tip.on{opacity:1}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.weak button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:5px 9px;font-size:13.5px}
.weak button .ru{font-size:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
label.sw{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
select{font:inherit;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
input[type=range]{width:180px}
@media (max-width:640px){
  h1{font-size:25px}
  .brand{font-size:19px}
  .topin{flex-wrap:wrap;gap:6px}
  nav.tabs{order:3;flex-basis:100%}
  .big{font-size:34px}
  .qbig{font-size:44px}
}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><clipPath id="fc"><rect width="30" height="20" rx="3.5"/></clipPath><g clip-path="url(#fc)"><rect width="30" height="7" fill="#fff"/><rect y="6.67" width="30" height="6.67" fill="#0039A6"/><rect y="13.33" width="30" height="6.67" fill="#D52B1E"/></g><rect x=".5" y=".5" width="29" height="19" rx="3" fill="none" stroke="currentColor" stroke-opacity=".2"/></svg><b class="bt">Говори́<i class="dot">.</i></b></div>
  <nav class="tabs" id="tabs">
    <a href="#home" data-v="home">Today</a>
    <a href="#alphabet" data-v="alphabet">Alphabet</a>
    <a href="#sounds" data-v="sounds">Sounds</a>
    <a href="#phrases" data-v="phrases">Phrases</a>
    <a href="#dialogues" data-v="dialogues">Dialogues</a>
    <a href="#read" data-v="read">Read</a>
    <a href="#write" data-v="write">Write</a>
    <a href="#review" data-v="review">Review</a>
  </nav>
  <button class="iconbtn" id="setBtn" title="Settings">⚙︎ Settings</button>
</div></header>
<main class="wrap" id="app"></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================== DATA ============================== */
// [Upper, lower, letter name, short sound, tip, example, example phonetic, example meaning, group]
const LETTERS = [
["А","а","а","a",'Like "a" in "father" — French "a" in "patte".',"ма́ма","MA-ma","mom",1],
["Б","б","бэ","b",'Like "b" in "bed".',"брат","brat","brother",3],
["В","в","вэ","v",'Looks like B, but sounds like "v" in "vase".',"вода́","va-DA","water",2],
["Г","г","гэ","g",'Always a hard "g" as in "go" — never the soft French "g" of "gel".',"го́род","GO-rat","city",3],
["Д","д","дэ","d",'A "d" with the tongue touching the teeth, as in French.',"дом","dom","house",3],
["Е","е","е","ye",'Looks like E, but sounds "ye" as in "yes". After a consonant it softens it: нет = "nyet".',"нет","nyet","no",2],
["Ё","ё","ё","yo",'"yo" as in "yogurt". Always stressed. Often printed without its dots (as Е).',"ёж","yosh","hedgehog",4],
["Ж","ж","жэ","zh",'Like French "j" in "jour", but harder, tongue pulled back. Always hard.',"жена́","zhy-NA","wife",4],
["З","з","зэ","z",'Like "z" in "zoo".',"зима́","zi-MA","winter",3],
["И","и","и","ee",'"ee" as in "see" — French "i".',"и́мя","EE-mya","first name",3],
["Й","й","и кра́ткое","y (short)",'A short "y" as in "boy". Almost always after a vowel.',"чай","chai","tea",3],
["К","к","ка","k",'Like "k", without a puff of air (as in French).',"кот","kot","cat",1],
["Л","л","эль","l",'A "dark" l: tongue tip on the teeth, back of the tongue raised — like "l" in "full".',"луна́","loo-NA","moon",3],
["М","м","эм","m",'Like "m".',"мир","meer","world / peace",1],
["Н","н","эн","n",'Looks like H, but sounds "n".',"нос","nos","nose",2],
["О","о","о","o",'Stressed: "o" as in "more". Unstressed it sounds like "a"! молоко́ = "ma-la-KO".',"молоко́","ma-la-KO","milk",1],
["П","п","пэ","p",'A "p" without a puff of air, as in French.',"па́па","PA-pa","dad",3],
["Р","р","эр","r (rolled)",'Looks like P, but is a rolled or tapped "r" made with the tongue tip (like Spanish/Italian) — not the French throat "r".',"ры́ба","RY-ba","fish",2],
["С","с","эс","s",'Looks like C, but is always "s" as in "sun".',"сок","sok","juice",2],
["Т","т","тэ","t",'A "t" with the tongue on the teeth, as in French.',"тут","toot","here",1],
["У","у","у","oo",'Looks like y, but sounds "oo" — French "ou".',"у́тро","OO-tra","morning",2],
["Ф","ф","эф","f",'Like "f".',"фо́то","FO-ta","photo",3],
["Х","х","ха","kh",'Looks like X, but is a throaty "kh" — like German "Bach" or Spanish "jota".',"хлеб","khlyep","bread",2],
["Ц","ц","цэ","ts",'"ts" as in "cats". Always hard.',"цвет","tsvyet","colour",4],
["Ч","ч","че","ch",'"ch" as in "cheese". Always soft.',"час","chas","hour",4],
["Ш","ш","ша","sh",'A hard "sh", tongue pulled back — French "ch" in "chat".',"шко́ла","SHKO-la","school",4],
["Щ","щ","ща","shch",'A long, soft "sh-sh" — like "fresh sheep" said quickly.',"щи","shchee","cabbage soup",4],
["Ъ","ъ","твёрдый знак","hard sign",'Hard sign — no sound. It separates a consonant from a following е/ё/ю/я, which keep their "y".',"подъе́зд","pad-YEST","building entrance",5],
["Ы","ы","ы","y (ы)",'No English or French equivalent. Say "i" with your tongue pulled back, as if starting "oo" but with spread lips.',"сыр","syr","cheese",4],
["Ь","ь","мя́гкий знак","soft sign",'Soft sign — no sound of its own. It softens the consonant before it (a light "y" quality).',"соль","sol'","salt",5],
["Э","э","э","e",'"e" as in "bet" — French "è".',"э́то","E-ta","this / it is",3],
["Ю","ю","ю","yu",'"yu" as in "you".',"юг","yook","south",4],
["Я","я","я","ya",'"ya" as in "yard". On its own, я means "I".',"я́блоко","YA-bla-ka","apple",4],
];
const GROUPS = {
 1:["Easy friends","Look and sound like Latin letters."],
 2:["False friends","Look Latin, but sound different. The classic trap."],
 3:["New shapes, familiar sounds","Unfamiliar shapes for sounds you already make."],
 4:["New sounds","The sounds that need real practice."],
 5:["Signs","Silent letters that change how others sound."]
};
// [russian with stress, phonetic (CAPS = stressed), meaning]
const WORDS = [
["ма́ма","MA-ma","mom"],["па́па","PA-pa","dad"],["кот","kot","cat"],["там","tam","there"],["тут","toot","here"],
["кто","kto","who"],["как","kak","how"],["так","tak","so / like this"],["да","da","yes"],["нет","nyet","no"],
["вот","vot","here is"],["дом","dom","house"],["сок","sok","juice"],["суп","soop","soup"],["торт","tort","cake"],

const LS_KEY = "govori-state-v1";
const DEFAULT = {srs:{}, known:[], streak:{last:null,count:0}, newToday:{d:null,n:0}, activity:{}, settings:{voice:null,rate:0.9,showPh:true,phonetic:true,newPerDay:10}, readGroups:[1,2], stats:{letters:{},pairs:{},words:{}}, days:{}, updatedAt:0};
let S = loadLocal();
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const o = JSON.parse(raw); return deepMerge(structuredClone(DEFAULT), o);} }catch(e){}
  return structuredClone(DEFAULT);
}
function deepMerge(a,b){ for(const k in b){ if(b[k] && typeof b[k]==="object" && !Array.isArray(b[k]) && a[k] && typeof a[k]==="object" && !Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }
let cloud = {ref:null, busy:false, pending:false, timer:null};
function save(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(cloud.ref){ clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 1500); }
}
async function pushCloud(){
  if(!cloud.ref) return;
  if(cloud.busy){ cloud.pending = true; return; }
  cloud.busy = true;
  try{ await cloud.ref.set({json: JSON.stringify(S), updatedAt: S.updatedAt}); }catch(e){}
  cloud.busy = false;
  if(cloud.pending){ cloud.pending = false; pushCloud(); }
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.collection("data/users/"+id).doc("state");
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej("timeout"),10000))]);
    let data = snap && typeof snap.data === "function" ? snap.data() : snap;
    cloud.ref = ref;
    if(data && data.json && (data.updatedAt||0) > (S.updatedAt||0)){
      S = deepMerge(structuredClone(DEFAULT), JSON.parse(data.json));
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      applySettings(); route();
    } else if(S.updatedAt){ pushCloud(); }
  }catch(e){ /* stay local */ }
}
const dstr = (off=0) => { const d=new Date(); d.setDate(d.getDate()+off); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const today0 = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const today = () => dstr(0);
function markActivity(){
  const t = today();
  S.activity[t] = (S.activity[t]||0)+1;
  if(S.streak.last !== t){
    const y = new Date(); y.setDate(y.getDate()-1);
    const ys = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    S.streak.count = (S.streak.last === ys) ? S.streak.count+1 : 1;
    S.streak.last = t;
  }
  // keep activity map small
  const keys = Object.keys(S.activity).sort(); while(keys.length>60){ delete S.activity[keys.shift()]; }
  save();
}
function currentStreak(){
  if(!S.streak.last) return 0;
  const y = new Date(); y.setDate(y.getDate()-1);
  const ys = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  return (S.streak.last===today()||S.streak.last===ys) ? S.streak.count : 0;
}

function day(t){ t=t||today(); if(!S.days[t]) S.days[t]={}; return S.days[t]; }
function rec(mod, ok, cat, key){
  const d=day(); const m=d[mod]||(d[mod]={done:0,c:0,t:0});
  m.done++;
  if(ok===true||ok===false){ m.t++; if(ok) m.c++;
    if(cat && key!=null){ const st=S.stats[cat]||(S.stats[cat]={}); const e=st[key]||(st[key]=[0,0]); e[1]++; if(ok) e[0]++; } }
  const ks=Object.keys(S.days).sort(); while(ks.length>120) delete S.days[ks.shift()];
  markActivity();
}
function rulesDoneCount(d){ const h=(d&&d.rx)||[]; return RULES.filter(r=>r.ex.every(e=>h.includes(e[0]))).length; }
function noteExample(ru){ const d=day(); d.rx=d.rx||[]; if(!d.rx.includes(ru)){ d.rx.push(ru); markActivity(); } }
function notePhrase(ru){ const d=day(); d.ps=d.ps||[]; if(!d.ps.includes(ru)){ d.ps.push(ru); markActivity(); } }
function mastered(U){ const e=(S.stats.letters||{})[U]; return S.known.includes(U) || (e && e[0]>=3 && e[0]/e[1]>=0.75); }
const masteredCount = () => LETTERS.filter(l=>mastered(l[0])).length;
function accOver(mods, n){ let c=0,t=0; for(let i=0;i<n;i++){ const d=S.days[dstr(-i)]; if(!d) continue; mods.forEach(m=>{ if(d[m]){ c+=d[m].c; t+=d[m].t; } }); } return t?{p:c/t,c,t}:null; }
function reviewLeft(){ return dueItems().length + Math.min(newAvailable(), nextNew(999).length); }
function goalState(k, dateKey){
  const isToday=!dateKey||dateKey===today(); const d=S.days[dateKey||today()]||{}; const g=GOALS[k];
  if(k==="review"){ const left=isToday?reviewLeft():null; const done=!!d.reviewDone||(isToday&&left===0); return {val:done?1:0,n:1,done,txt:done?"Done for today":left+" cards left"}; }
  if(k==="sounds"){ const ear=(d.sounds&&d.sounds.done)||0, rules=rulesDoneCount(d); const done=ear>=10||rules>=RULES.length; const val=done?10:Math.max(Math.min(ear,10),Math.round(rules*10/RULES.length)); return {val,n:10,done,txt:`${Math.min(ear,10)}/10 ear training · ${rules}/${RULES.length} rules`}; }
  const raw = k==="phrases" ? (d.ps||[]).length : ((d[k]&&d[k].done)||0);
  const val=Math.min(raw,g.n); return {val,n:g.n,done:raw>=g.n,txt:`${val}/${g.n} ${g.unit}`};
}

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => s.replace(/́/g,"");
const norm = s => strip(s).toLowerCase().replace(/ё/g,"е").replace(/[^а-яa-z\s-]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim();
const stressHTML = s => esc(s).replace(/([аеёиоуыэюяАЕЁИОУЫЭЮЯ]́)/g,'<span class="sv">$1</span>');
const phHTML = s => esc(s).replace(/([A-Z][A-Z']*)/g,"<b>$1</b>");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); } p=c; } return p[n]; }
const sim = (a,b) => { a=norm(a).replace(/ /g,""); b=norm(b).replace(/ /g,""); const L=Math.max(a.length,b.length)||1; return 1-lev(a,b)/L; };
const ICON = {
 play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',

 mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',

/* ============================== SPEECH ============================== */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang)); }catch(e){ voices=[]; } }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); if(curView==="home") route(); }; }
function getVoice(){ if(!voices.length) return null; return voices.find(v=>v.name===S.settings.voice) || voices.find(v=>/google/i.test(v.name)) || voices[0]; }
function speak(text, slow=false, onend){
  if(!("speechSynthesis" in window)){ toast("This browser can't speak — try Chrome, Edge or Safari."); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(strip(text).replace(/…/g,""));
    u.lang = "ru-RU"; const v = getVoice(); if(v) u.voice = v;
    u.rate = slow ? Math.max(0.45, S.settings.rate*0.62) : S.settings.rate;
    if(onend){ u.onend = onend; u.onerror = onend; }
    speechSynthesis.speak(u);
    if(!v && !voices.length) toast("No Russian voice found on this device — see Settings.");
  }catch(e){ toast("Couldn't play audio."); }
}
function speakThen(text, cb, pause=600){ let fired=false; const go=()=>{ if(fired) return; fired=true; clearTimeout(t); setTimeout(cb,pause); }; const t=setTimeout(go, 1500+strip(text).length*110); speak(text,false,go); }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micState = SR ? "unknown" : "unsupported"; // unknown | ok | blocked | unsupported
const MIC_MSG = {
 unsupported:"Speech checking isn't available in this browser. Use Chrome or Edge on a computer, with the downloadable copy of this app.",
 blocked:"The microphone is blocked here (the hosted page can't use it). Open the downloadable copy of this app (russian-practice.html) in Chrome or Edge to get speech checking and recording. Everything else works here."
};
function listen(target, onDone, alts){
  if(micState==="unsupported"||micState==="blocked"){ onDone({error:MIC_MSG[micState]}); return null; }
  let rec;
  try{ rec = new SR(); }catch(e){ micState="unsupported"; onDone({error:MIC_MSG.unsupported}); return null; }
  rec.lang="ru-RU"; rec.interimResults=false; rec.maxAlternatives=5; rec.continuous=false;
  let done=false;
  rec.onresult = ev => {
    done=true; micState="ok";
    const altsOK=alts||[]; const altsArr=[...ev.results[0]].map(a=>a.transcript);
    let best=altsArr[0]||"", bs=-1;
    altsArr.forEach(a=>{ let s=sim(a,target); if(altsOK.length && altsOK.includes(a.replace(/[\s.,]/g,""))) s=1; if(s>bs){bs=s;best=a;} });
    onDone({heard:best, score:Math.max(0,bs)});
  };
  rec.onerror = ev => {
    done=true;
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed"||ev.error==="audio-capture"){ micState="blocked"; onDone({error:MIC_MSG.blocked}); }
    else if(ev.error==="no-speech"){ onDone({error:"I didn't hear anything — try again, a bit closer to the mic."}); }
    else if(ev.error==="network"){ onDone({error:"Speech checking needs an internet connection."}); }
    else onDone({error:"Speech check failed ("+ev.error+"). Try again."});
  };
  rec.onend = () => { if(!done) onDone({error:"I didn't catch that — try again."}); };
  try{ rec.start(); }catch(e){ micState="blocked"; onDone({error:MIC_MSG.blocked}); return null; }
  return rec;
}
function wordDiff(target, heard){
  const tw = norm(target).split(" "), hw = norm(heard).split(" ");
  const orig = strip(target).replace(/[!?.,…]/g,"").split(/\s+/).filter(Boolean);
  return orig.map((w,i)=>{ const n=tw[i]||""; const ok=hw.some(h=>sim(h,n)>=0.75); return `<span class="${ok?"w-ok":"w-no"}">${esc(w)}</span>`; }).join(" ");
}
// recorder
let mediaRec=null, recChunks=[], lastRecURL=null;
async function toggleRecord(btn, onReady){
  if(mediaRec && mediaRec.state==="recording"){ mediaRec.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast("Recording isn't supported in this browser."); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[]; mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e=>recChunks.push(e.data);
    mediaRec.onstop = ()=>{ stream.getTracks().forEach(t=>t.stop()); if(lastRecURL) URL.revokeObjectURL(lastRecURL); lastRecURL = URL.createObjectURL(new Blob(recChunks,{type:mediaRec.mimeType||"audio/webm"})); btn.innerHTML=ICON.rec+" Record myself"; btn.classList.remove("bad"); onReady(); };
    mediaRec.start(); btn.innerHTML=ICON.rec+" Stop"; btn.classList.add("bad");
    setTimeout(()=>{ if(mediaRec && mediaRec.state==="recording") mediaRec.stop(); }, 8000);
  }catch(e){ micState = SR ? "blocked" : micState; toast("Microphone not available here — use the downloadable copy."); }
}

// The practice panel: listen, slow, say-it check, record & compare
function practice(ru, ph, en, note){
  openModal(`
    <div class="small muted">Pronunciation practice</div>
    <div class="big">${stressHTML(ru)}</div>
    <div class="ph" style="font-size:17px">${phHTML(ph)}</div>
    <div class="en" style="margin-top:2px">${esc(en)}</div>
    ${note?`<div class="note">${esc(note)}</div>`:""}
    <h3 style="margin-top:18px">1 · Listen</h3>
    <div class="row"><button class="btn pri" id="pl">${ICON.play} Listen</button><button class="btn" id="ps">${ICON.slow} Slowly</button></div>
    <h3 style="margin-top:16px">2 · Say it</h3>
    <div class="row"><button class="btn acc" id="say">${ICON.mic} Say it &amp; check</button><button class="btn" id="rec">${ICON.rec} Record myself</button><button class="btn" id="mine" disabled>▶ Play mine</button></div>
    <div id="res"></div>
    <p class="small muted" style="margin:14px 0 0">Tip: listen three times, then say it out loud before checking. Exaggerate the <span class="sv">stressed</span> vowel and relax the others.</p>
  `, sh=>{
    $("#pl",sh).onclick=()=>speak(ru);
    $("#ps",sh).onclick=()=>speak(ru,true);
    const res=$("#res",sh);
    $("#say",sh).onclick=()=>{
      res.innerHTML=`<div class="result mid">Listening… speak now.</div>`;
      listen(ru, r=>{
        if(r.error){ res.innerHTML=`<div class="notice w" style="margin-top:12px">${esc(r.error)}</div>`; return; }
        rec("speak", r.score>=0.85);
        const pct=Math.round(r.score*100), cls=pct>=85?"good":pct>=60?"mid":"low";
        const verdict=pct>=85?"Excellent — that's clearly understood.":pct>=60?"Close — compare the red words and try again.":"Not quite — listen slowly and try again.";
        res.innerHTML=`<div class="result ${cls}"><b>${pct}%</b> · ${verdict}<div class="heard" style="margin-top:6px;color:var(--ink)">Target: <span class="ru">${wordDiff(ru,r.heard)}</span></div><div class="small" style="color:var(--muted)">Heard: «${esc(r.heard)}»</div></div>`;
      });
    };
    $("#rec",sh).onclick=e=>toggleRecord(e.currentTarget, ()=>{ const b=$("#mine",sh); b.disabled=false; b.onclick=()=>{ const a=new Audio(lastRecURL); a.onended=()=>speak(ru); a.play().catch(()=>{}); }; toast("Recorded. “Play mine” plays you, then the model."); });
  });
}

const ALL_ITEMS = [];
for(const [cat,list] of Object.entries(PHRASES)) list.forEach(p=>ALL_ITEMS.push({id:"p:"+p[0],ru:p[0],ph:p[1],en:p[2],note:p[3],kind:cat}));
WORDS.forEach(w=>ALL_ITEMS.push({id:"w:"+w[0],ru:w[0],ph:w[1],en:w[2],kind:"Word"}));
const ITEM = Object.fromEntries(ALL_ITEMS.map(i=>[i.id,i]));
// Interleave: phrases first by category order, words mixed in after the first greetings
const NEW_ORDER = (()=>{ const p=ALL_ITEMS.filter(i=>i.id.startsWith("p:")&&i.kind!=="Numbers"), n=ALL_ITEMS.filter(i=>i.kind==="Numbers"), w=ALL_ITEMS.filter(i=>i.kind==="Word"); const out=[]; let a=0,b=0,c=0; while(a<p.length||b<w.length||c<n.length){ for(let k=0;k<2&&a<p.length;k++) out.push(p[a++]); for(let k=0;k<2&&b<w.length;k++) out.push(w[b++]); if(c<n.length) out.push(n[c++]); } return out; })();
const INTERVALS=[0,1,2,4,8,16,32,64];
const dayNum = () => { const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); };
function dueItems(){ const t=dayNum(); return Object.entries(S.srs).filter(([id,r])=>ITEM[id] && r.due<=t).map(([id])=>ITEM[id]); }
function newAvailable(){ if(S.newToday.d!==today()) return S.settings.newPerDay; return Math.max(0,S.settings.newPerDay-S.newToday.n); }
function nextNew(k){ return NEW_ORDER.filter(i=>!S.srs[i.id]).slice(0,k); }
function grade(id, g){ // g: 0 again, 1 good, 2 easy
  const r = S.srs[id] || {box:0,due:0,seen:0};
  if(!S.srs[id]){ if(S.newToday.d!==today()) S.newToday={d:today(),n:0}; S.newToday.n++; }
  if(g===0) r.box=0; else if(g===0.5) r.box=Math.max(1,r.box); else r.box=Math.min(INTERVALS.length-1, r.box+(g===2?2:1));
  r.due = dayNum()+(g===0?0:g===0.5?1:INTERVALS[r.box]); r.seen=(r.seen||0)+1;
  S.srs[id]=r; rec("review", g>=1, "words", ITEM[id].ru);
}
const learnedCount = () => Object.values(S.srs).filter(r=>r.box>=2).length;

function drawHistory(box){
  const N=14, W=440, H=190, pl=26, pb=34, pt=10, days=[];
  for(let i=N-1;i>=0;i--){ const k=dstr(-i), d=S.days[k]||{}; let n=0,c=0,tt=0; Object.values(d).forEach(m=>{ if(m&&typeof m==="object"&&!Array.isArray(m)&&"done" in m){ n+=m.done; c+=m.c; tt+=m.t; } }); n+=(d.ps||[]).length; days.push({k,n,c,t:tt,met:goalsMet(k)}); }
  const max=Math.max(10,...days.map(d=>d.n)); const nice=Math.ceil(max/10)*10;
  const bw=(W-pl)/N, y=v=>pt+(H-pt-pb)*(1-v/nice);
  const lab=k=>{ const [yy,mm,dd]=k.split("-"); return +dd+"/"+(+mm); };
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Exercises per day over the last 14 days">`;
  [0,nice/2,nice].forEach(v=>{ svg+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; });
  days.forEach((d,i)=>{ const x=pl+i*bw+bw*0.18, w=bw*0.64, h=Math.max(0,y(0)-y(d.n)), r=Math.min(4,w/2,h);
    const path = h>0 ? `M${x},${y(0)} V${y(d.n)+r} Q${x},${y(d.n)} ${x+r},${y(d.n)} H${x+w-r} Q${x+w},${y(d.n)} ${x+w},${y(d.n)+r} V${y(0)} Z` : "";
    svg+=`<rect class="hit" data-i="${i}" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb+4}" fill="transparent"/>`;
    if(path) svg+=`<path class="bar" data-i="${i}" d="${path}"/>`;
    if(i%2===(N-1)%2||N<=7) svg+=`<text x="${x+w/2}" y="${H-pb+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${i===N-1?"today":lab(d.k)}</text>`;
    if(d.met===Object.keys(GOALS).length) svg+=`<text x="${x+w/2}" y="${H-4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok)">✓</text>`;
  });
  svg+=`</svg><div class="tip" id="tip"></div>`;
  box.innerHTML=svg;
  const tip=$("#tip",box);
  box.querySelectorAll(".hit").forEach(h=>{
    const d=days[+h.dataset.i];
    const show=()=>{ box.querySelectorAll(".bar").forEach(b=>b.classList.toggle("hl",b.dataset.i===h.dataset.i)); const r=box.getBoundingClientRect(), hr=h.getBoundingClientRect();
      tip.innerHTML=`<b>${d.k===today()?"Today":lab(d.k)}</b><br>${d.n} exercises${d.t?` · ${Math.round(d.c/d.t*100)}% correct`:""}<br>${d.met}/${Object.keys(GOALS).length} goals met`;
      tip.style.left=Math.min(Math.max(hr.left-r.left+hr.width/2,70),r.width-70)+"px"; tip.style.top=(hr.top-r.top+6)+"px"; tip.classList.add("on"); };
    h.addEventListener("mouseenter",show); h.addEventListener("click",show);
    h.addEventListener("mouseleave",()=>{ tip.classList.remove("on"); box.querySelectorAll(".bar").forEach(b=>b.classList.remove("hl")); });
  });
}
function drawWeak(box){
  const pickWeak=(o,min=2)=>Object.entries(o||{}).filter(([k,e])=>e[1]>=min && e[0]/e[1]<0.8).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).slice(0,8);
  const L=pickWeak(S.stats.letters), P=pickWeak(S.stats.pairs), Wd=pickWeak(S.stats.words);
  if(!L.length&&!P.length&&!Wd.length){ box.innerHTML=`<p class="small muted" style="margin:0">Nothing yet. Anything you get wrong at least twice (under 80% correct) will show up here so you can drill it.</p>`; return; }
  const pc=e=>Math.round(e[0]/e[1]*100)+"%";
  let h="";
  if(L.length) h+=`<div class="small muted" style="margin:6px 0 4px">Letters (tap to study)</div><div class="weak">${L.map(([k,e])=>`<button data-l="${k}"><span class="ru">${k}${LETTERS.find(l=>l[0]===k)[1]}</span> ${pc(e)}</button>`).join("")}</div>`;
  if(P.length) h+=`<div class="small muted" style="margin:10px 0 4px">Sound contrasts (practise in Sounds → Ear training)</div><div class="weak">${P.map(([k,e])=>`<button data-go="sounds">${esc(k)} · ${pc(e)}</button>`).join("")}</div>`;
  if(Wd.length) h+=`<div class="small muted" style="margin:10px 0 4px">Words &amp; phrases (tap to practise)</div><div class="weak">${Wd.map(([k,e])=>`<button data-w="${esc(k)}"><span class="ru">${stressHTML(k)}</span> ${pc(e)}</button>`).join("")}</div>`;
  box.innerHTML=h;
  box.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>letterCard(b.dataset.l));
  box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ location.hash="#sounds"; });
  box.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ const ru=b.dataset.w; const it=ALL_ITEMS.find(x=>x.ru===ru); if(it) practice(it.ru,it.ph,it.en,it.note); else { const w=WORDS.find(x=>x[0]===ru); if(w) practice(w[0],w[1],w[2]); else speak(ru); } });
}

function vAlphabet(app){
  let html=`<h1>The Cyrillic alphabet</h1><p class="lead">33 letters. Tap one to hear it, see how it's handwritten, and get a pronunciation tip. A letter gets a green dot when you answer it correctly in the quiz (3+ times, 75%+) or mark it as known. The quiz focuses on the letters you miss most.</p>

    html+=`<div class="ghead"><h3>${g} · ${GROUPS[g][0]}</h3><span class="small muted">${GROUPS[g][1]}</span></div><div class="letters">`;

function letterCard(U){
  const l=LETTERS.find(x=>x[0]===U);
  const known=S.known.includes(U);
  openModal(`
    <div class="row" style="gap:22px;align-items:flex-end">
      <div><div class="small muted">Print</div><div class="ru" style="font-size:76px;line-height:1">${l[0]}${l[1]}</div></div>
      <div><div class="small muted">Handwriting</div><div class="cursive" style="font-size:76px;line-height:1">${l[0]}${l[1]}</div></div>
    </div>
    <div style="margin-top:10px"><b>Sound:</b> ${esc(l[3])} &nbsp;·&nbsp; <span class="muted">name: <span class="ru">${esc(l[2])}</span></span></div>
    <p style="margin:8px 0">${esc(l[4])}</p>
    ${(()=>{ const e=(S.stats.letters||{})[U]; return e?`<p class="small muted" style="margin:0 0 8px">Quiz record: ${e[0]}/${e[1]} correct (${Math.round(e[0]/e[1]*100)}%)${mastered(U)?" · mastered":""}</p>`:""; })()}
    <div class="card" style="background:var(--bg);box-shadow:none">
      <div class="small muted">Example</div>
      <div class="ru" style="font-size:28px">${stressHTML(l[5])}</div>
      <div class="ph">${phHTML(l[6])}</div><div class="en">${esc(l[7])}</div>
      <div class="row" style="margin-top:8px"><button class="btn pri sm" id="ex">${ICON.play} Listen</button><button class="btn sm" id="exs">${ICON.slow} Slowly</button><button class="btn sm" id="exp">${ICON.mic} Practise</button></div>
    </div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button class="btn sm" id="nm">${ICON.play} Letter name</button>
      <div class="row"><button class="btn sm" id="prev">←</button><button class="btn sm ${known?"ok":""}" id="kn">${known?"✓ Known":"Mark as known"}</button><button class="btn sm" id="next">→</button></div>
    </div>`, sh=>{
      $("#ex",sh).onclick=()=>speak(l[5]); $("#exs",sh).onclick=()=>speak(l[5],true);
      $("#exp",sh).onclick=()=>practice(l[5],l[6],l[7]);
      $("#nm",sh).onclick=()=>speak(l[2]);
      $("#kn",sh).onclick=()=>{ if(S.known.includes(U)) S.known=S.known.filter(x=>x!==U); else S.known.push(U); save(); letterCard(U); if(curView==="alphabet") refreshLetters(); };
      const i=LETTERS.indexOf(l);
      $("#prev",sh).onclick=()=>letterCard(LETTERS[(i+32)%33][0]);
      $("#next",sh).onclick=()=>letterCard(LETTERS[(i+1)%33][0]);
      speak(l[5]);
  });
}
function refreshLetters(){ document.querySelectorAll(".lt").forEach(b=>b.classList.toggle("known",mastered(b.dataset.l))); }
function letterQuiz(){
  let n=0, score=0; const total=12;
  const pool = (()=>{ const items=LETTERS.map(l=>{ const e=(S.stats.letters||{})[l[0]]; const err=e?1-e[0]/e[1]:0.5; return {l, w:0.4+err*3+(mastered(l[0])?0:1.2)}; }); const out=[]; while(out.length<total){ const sum=items.reduce((a,b)=>a+b.w,0); let r=Math.random()*sum, i=0; while(r>items[i].w){ r-=items[i].w; i++; } out.push(items[i].l); items.splice(i,1); } return out; })();
  function q(){
    if(n>=total){ openModal(`<h2 style="margin-top:0">Quiz done</h2><p>You got <b>${score}/${total}</b>.</p><p class="muted small">Letters you missed are worth a second look — especially the false friends В Н Р С У Х.</p><div class="row"><button class="btn pri" id="ag">Again</button></div>`,sh=>$("#ag",sh).onclick=letterQuiz); return; }
    const l=pool[n], lower=Math.random()<.5;
    const opts=shuffle([l, ...shuffle(LETTERS.filter(x=>x!==l)).slice(0,3)]);
    openModal(`<div class="progress"><i style="width:${n/total*100}%"></i></div>
      <div class="small muted" style="margin-top:10px">What sound does this letter make?</div>
      <div class="qbig">${lower?l[1]:l[0]}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-u="${o[0]}">${esc(o[3])}</button>`).join("")}</div>
      <div id="fb" style="min-height:60px"></div>`, sh=>{
        let answered=false;
        sh.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
          if(answered) return; answered=true;
          const ok=b.dataset.u===l[0]; if(ok) score++;
          b.classList.add(ok?"right":"wrong"); sh.querySelector(`.opt[data-u="${l[0]}"]`).classList.add("right");
          rec("alphabet", ok, "letters", l[0]);
          $("#fb",sh).innerHTML=`<p class="small" style="margin:12px 0 8px">${esc(l[4])} &nbsp;<span class="ru">${stressHTML(l[5])}</span> — ${esc(l[7])}</p><button class="btn pri sm" id="nx">Next →</button>`;
          speak(l[5]); $("#nx",sh).onclick=()=>{n++;q();};
        });
    });
  }
  q();
}

function exBtn(e){ return `<button class="exb" data-ru="${esc(e[0])}"><span class="ru">${stressHTML(e[0])}</span><span class="ph">${phHTML(e[1])}</span><span class="en">${esc(e[2])}</span></button>`; }

function updSGoal(){
  const el=$("#sgoal"); if(!el) return; const st=goalState("sounds");
  el.innerHTML = st.done
    ? `<div class="result good" style="margin:0"><b>✓ Sounds done for today.</b> Extra practice still counts.</div>`
    : `<div class="small muted">Today: <b>${st.txt}</b> — hear every example in all 8 rules (each card turns green), <i>or</i> finish one ear-training round below.</div><div class="meter"><i style="width:${st.val/st.n*100}%"></i></div>`;
}
function earTrainer(box){
  let n=0, score=0; const total=10;
  function q(){
    if(n>=total){ box.innerHTML=`<h3>Score: ${score}/${total}</h3><p class="small muted">Above 8 means your ear is ready for these contrasts. Below that, replay the pairs in rule 4 and in the alphabet card for Ы.</p><button class="btn pri" id="er">Play again</button>`; $("#er",box).onclick=()=>{n=0;score=0;q();}; return; }
    const p=pick(PAIRS), first=Math.random()<.5, target=first?p[0]:p[2];
    box.innerHTML=`<div class="progress"><i style="width:${n/total*100}%"></i></div>
     <div class="row" style="justify-content:space-between;margin-top:12px"><span class="small muted">Contrast: ${esc(p[4])}</span><span class="small muted">${n+1} / ${total}</span></div>
     <div class="row" style="justify-content:center;margin:16px 0"><button class="btn pri" id="pp">${ICON.play} Play again</button><button class="btn" id="psl">${ICON.slow} Slowly</button></div>
     <div class="opts"><button class="opt" data-w="${esc(p[0])}"><span class="ru" style="font-size:26px">${stressHTML(p[0])}</span><br><span class="small muted">${esc(p[1])}</span></button><button class="opt" data-w="${esc(p[2])}"><span class="ru" style="font-size:26px">${stressHTML(p[2])}</span><br><span class="small muted">${esc(p[3])}</span></button></div>
     <div id="fb" style="min-height:44px;margin-top:10px"></div>`;
    $("#pp",box).onclick=()=>speak(target); $("#psl",box).onclick=()=>speak(target,true);
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(box.dataset.lock==="1") return; box.dataset.lock="1";
      const ok=b.dataset.w===target; if(ok) score++; rec("sounds", ok, "pairs", p[4]); updSGoal();
      b.classList.add(ok?"right":"wrong"); [...box.querySelectorAll(".opt")].find(x=>x.dataset.w===target).classList.add("right");
      $("#fb",box).innerHTML=`<div class="row"><span>${ok?"Right.":"That was <b class='ru'>"+stressHTML(target)+"</b>."} Compare:</span><button class="btn sm" id="ca">${stressHTML(p[0])}</button><button class="btn sm" id="cb">${stressHTML(p[2])}</button><button class="btn pri sm" id="nx">Next →</button></div>`;
      $("#ca",box).onclick=()=>speak(p[0]); $("#cb",box).onclick=()=>speak(p[2]); $("#nx",box).onclick=()=>{n++;box.dataset.lock="0";q();};
    });
    box.dataset.lock="0";
  }
  box.innerHTML=`<p style="margin-top:0">10 rounds. Use headphones if you can.</p><button class="btn acc" id="st">Start ear training</button>`;
  $("#st",box).onclick=()=>{ q(); };
}

let phraseCat="Greetings";
function vPhrases(app){
  const cats=Object.keys(PHRASES);
  app.innerHTML=`<h1>Everyday phrases</h1><p class="lead">The building blocks of a first conversation. Try each one first with <b>Say it</b> — your score appears right on the card — then <b>Listen</b> to compare. Every phrase also feeds your daily review. Phrases you've worked on today turn green.</p>

        }, /^\d+$/.test(p[2])?[p[2]]:[]);

let dlgIdx=0;
function dialogueDone(idx){ const d=day(); d.dl=d.dl||[]; if(!d.dl.includes(idx)) d.dl.push(idx); rec("dialogues", null); }
function vDialogues(app){
  const d=DIALOGUES[dlgIdx];
  app.innerHTML=`<h1>Dialogues</h1><p class="lead">Short real-life exchanges. Listen to the whole thing first, then switch to <b>role-play</b>: the app speaks the other person, and you say your lines (marked <b style="color:var(--accent)">Я</b>) out loud.</p>
  <div class="row" id="dl">${DIALOGUES.map((x,i)=>`<button class="chip ${i===dlgIdx?"on":""}" data-i="${i}"><span class="ru">${stressHTML(x.title)}</span> · ${esc(x.en)}<b class="ck" style="color:var(--ok)"></b></button>`).join("")}</div>
  <div class="row" style="margin:14px 0"><button class="btn pri" id="pa">${ICON.play} Listen to all</button><button class="btn acc" id="rp">Role-play: I'm “Я”</button></div>
  <div id="dbox"></div>`;
  app.querySelectorAll("#dl .chip").forEach(b=>b.onclick=()=>{ dlgIdx=+b.dataset.i; vDialogues(app); });
  function refreshChips(){ const dn=(S.days[today()]||{}).dl||[]; app.querySelectorAll("#dl .chip").forEach(b=>{ const k=b.querySelector(".ck"); if(k) k.textContent=dn.includes(+b.dataset.i)?" ✓":""; }); }
  const box=$("#dbox");
  function draw(mask=-1, cur=-1){
    box.innerHTML=d.lines.map((l,i)=>{ const me=l[0]==="B"; const hidden=me && mask>=0 && i>=mask;
      return `<div class="line ${me?"me":""} ${i===cur?"cur":""}"><div class="who">${me?"Я":(d.who||"A")}</div><div class="bubble">
      <div class="${hidden?"masked":""}"><div class="ru">${stressHTML(l[1])}</div><div class="ph">${phHTML(l[2])}</div></div>
      <div class="en">${esc(l[3])}</div>
      <div class="row" style="margin-top:6px"><button class="btn sm" data-i="${i}" data-a="l">${ICON.play}</button><button class="btn sm" data-i="${i}" data-a="s">${ICON.slow}</button><button class="btn sm" data-i="${i}" data-a="p">${ICON.mic} Practise</button></div></div></div>`; }).join("");
    box.querySelectorAll("button[data-a]").forEach(b=>{ const l=d.lines[+b.dataset.i];
      b.onclick=()=>{ if(b.dataset.a==="l") speak(l[1]); else if(b.dataset.a==="s") speak(l[1],true); else practice(l[1],l[2],l[3]); }; });
  }
  draw(); refreshChips();
  $("#pa").onclick=()=>{ const my=++token; let i=0; const nx=()=>{ if(my!==token) return; if(i>=d.lines.length){ draw(); dialogueDone(dlgIdx); refreshChips(); return;} draw(-1,i); const l=d.lines[i++]; speakThen(l[1],nx,700); }; nx(); };
  $("#rp").onclick=()=>rolePlay();
  let token=0;
  function rolePlay(){
    token++; let i=0, recorded=false; const lastMine=d.lines.map(l=>l[0]).lastIndexOf("B");
    const markDone=()=>{ if(recorded) return; recorded=true; dialogueDone(dlgIdx); refreshChips(); };
    const step=()=>{
      if(i>=d.lines.length){ draw(); box.insertAdjacentHTML("afterbegin",`<div class="notice" style="margin-bottom:10px">Well done — dialogue complete. Try it again without looking at the pronunciation guide.</div>`); markDone(); return; }
      const l=d.lines[i];
      draw(i,i);
      if(l[0]==="A"){ const my=++token; speakThen(l[1],()=>{ if(my!==token) return; i++; step(); },500); }
      else{
        const bub=box.querySelectorAll(".line")[i].querySelector(".bubble");
        bub.insertAdjacentHTML("beforeend",`<div class="row" style="margin-top:8px"><span class="small" style="color:var(--accent);font-weight:600">Your turn — say it in Russian</span><button class="btn acc sm" id="chk">${ICON.mic} Check me</button><button class="btn pri sm" id="rev">Reveal &amp; hear</button></div><div id="rres"></div>`);
        bub.scrollIntoView({block:"center",behavior:"smooth"});
        let moved=false;
        const advance=()=>{ if(moved) return; moved=true; if(i>=lastMine) markDone(); const m=bub.querySelector(".masked"); if(m) m.classList.remove("masked"); $("#chk",box).disabled=true; $("#rev",box).disabled=true; const my=++token; speakThen(l[1],()=>{ if(my!==token) return; i++; step(); },900); };
        $("#chk",box).onclick=()=>{ if(moved) return; $("#rres",box).innerHTML=`<div class="result mid">Listening…</div>`; listen(l[1],r=>{ if(r.error){ $("#rres",box).innerHTML=`<div class="notice w" style="margin-top:8px">${esc(r.error)}</div>`; return;} const ok=r.score>=0.85; rec("speak", ok); const pct=Math.round(r.score*100);
          $("#rres",box).innerHTML=`<div class="result ${ok?"good":pct>=60?"mid":"low"}"><b>${pct}%</b> · heard «${esc(r.heard)}»${ok?" — well done, moving on…":`<div class="heard" style="color:var(--ink)">${wordDiff(l[1],r.heard)}</div><div class="small">Try again, or press Reveal &amp; hear.</div>`}</div>`;
          if(ok) setTimeout(advance,900); }); };
        $("#rev",box).onclick=advance;
      }
    };
    step();
  }
}

/* ---------- READ ---------- */
const lettersOf = w => new Set(strip(w).toLowerCase().replace(/[^а-яё]/g,""));
function allowedLetters(){ const s=new Set(); LETTERS.forEach(l=>{ if(S.readGroups.includes(l[8])) s.add(l[1]); }); return s; }
function readableWords(){ const a=allowedLetters(); return WORDS.filter(w=>[...lettersOf(w[0])].every(c=>a.has(c))); }
function groupChips(){ return `<div class="row">${[1,2,3,4,5].map(g=>`<button class="chip ${S.readGroups.includes(g)?"on":""}" data-g="${g}" title="${esc(GROUPS[g][1])}">${g} · ${GROUPS[g][0]} <span class="ru">${LETTERS.filter(l=>l[8]===g).map(l=>l[1]).join(" ")}</span></button>`).join("")}</div>`; }
function bindGroupChips(app, redraw){ app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ const g=+b.dataset.g; if(S.readGroups.includes(g)){ if(S.readGroups.length>1) S.readGroups=S.readGroups.filter(x=>x!==g); } else S.readGroups.push(g); save(); redraw(); }); }
let readMode="aloud";
function vRead(app){
  const words=readableWords();
  app.innerHTML=`<h1>Reading practice</h1><p class="lead">Choose which letter groups to include — you only get words you can actually decode. Rounds of 10 words with a score at the end. Read each word <b>out loud</b> before you check.</p>
  ${groupChips()}
  <div class="row" style="margin:14px 0"><button class="chip ${readMode==="aloud"?"on":""}" data-m="aloud">Read aloud</button><button class="chip ${readMode==="quiz"?"on":""}" data-m="quiz">Pick the pronunciation</button><span class="small muted">${words.length} words available</span></div>
  <div class="card" id="rbox" style="max-width:620px"></div>`;
  bindGroupChips(app, ()=>vRead(app));
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ readMode=b.dataset.m; vRead(app); });
  const box=$("#rbox");
  if(words.length<4){ box.innerHTML=`<p>Only ${words.length} word(s) use just these letters. Add the next group to get going.</p>`; return; }
  const ROUND=10;
  let order=[], i=0, results=[];
  function start(){ order=[]; while(order.length<ROUND) order.push(...shuffle(words)); order=order.slice(0,ROUND); i=0; results=[]; next(); }
  const header=()=>{ const s=results.filter(r=>r.ok).length; return `<div class="progress"><i style="width:${i/ROUND*100}%"></i></div><div class="row" style="justify-content:space-between;margin:8px 0 4px"><span class="small muted">Word ${Math.min(i+1,ROUND)} of ${ROUND}</span><span class="small muted">Score ${s}/${results.length}</span></div>`; };
  function record(w, ok){ results.push({w, ok}); rec("read", ok, "words", w[0]); }
  function finish(){
    const s=results.filter(r=>r.ok).length, missed=results.filter(r=>!r.ok);
    const msg = s===ROUND ? "Perfect round!" : s>=8 ? "Very good reading." : s>=5 ? "Good progress — keep going." : "Keep at it — replay the missed words below.";
    box.innerHTML=`<div class="progress"><i style="width:100%"></i></div>
      <div style="text-align:center;margin:18px 0 6px"><div class="small muted">Round complete</div><div class="qbig" style="margin:4px 0">${s}/${ROUND}</div><div>${msg}</div></div>
      ${missed.length?`<div class="small muted" style="margin:14px 0 6px">Words to look at again (tap to hear):</div><div class="weak">${missed.map((r,k)=>`<button data-k="${k}"><span class="ru">${stressHTML(r.w[0])}</span> <span class="ph">${phHTML(r.w[1])}</span> · ${esc(r.w[2])}</button>`).join("")}</div>`:""}
      <div class="row" style="justify-content:center;margin-top:18px"><button class="btn acc" id="again">Another ${ROUND} words</button><a class="btn" href="#home">Back to Today</a></div>`;
    box.querySelectorAll(".weak [data-k]").forEach(b=>b.onclick=()=>speak(missed[+b.dataset.k].w[0]));
    $("#again",box).onclick=start;
  }
  function next(){
    if(i>=ROUND){ finish(); return; }
    const w=order[i];
    const advance=()=>{ i++; next(); };
    if(readMode==="aloud"){
      let scored=false;
      box.innerHTML=`${header()}<div class="small muted">Read this out loud:</div><div class="qbig">${stressHTML(w[0])}</div>
      <div id="rv" style="text-align:center;min-height:70px"></div>
      <div class="row" style="justify-content:center" id="ra"><button class="btn acc" id="ck">${ICON.mic} Check my reading</button><button class="btn" id="sh">Hear it &amp; grade myself</button></div>`;
      const ra=$("#ra",box), rv=$("#rv",box);
      const reveal=()=>{ rv.innerHTML=`<div class="ph" style="font-size:18px">${phHTML(w[1])}</div><div class="en">${esc(w[2])}</div>`; };
      const after=(retry)=>{ ra.innerHTML=`<button class="btn sm" id="ag">${ICON.play} Hear it</button><button class="btn sm" id="sl">${ICON.slow}</button>${retry?`<button class="btn acc sm" id="ck2">${ICON.mic} Try again</button>`:""}<button class="btn pri" id="nx">${i+1>=ROUND?"See my score →":"Next →"}</button>`; $("#ag",box).onclick=()=>speak(w[0]); $("#sl",box).onclick=()=>speak(w[0],true); $("#nx",box).onclick=advance; const c2=$("#ck2",box); if(c2) c2.onclick=check; };
      const check=()=>{ rv.innerHTML=`<div class="result mid">Listening…</div>`; listen(w[0],r=>{
          if(r.error){ rv.innerHTML=`<div class="notice w">${esc(r.error)}</div>`; return; }
          const ok=r.score>=0.85; rec("speak", ok); const pct=Math.round(r.score*100);
          if(!scored){ scored=true; record(w, ok); }
          rv.innerHTML=`<div class="result ${ok?"good":pct>=60?"mid":"low"}"><b>${pct}%</b> · heard «${esc(r.heard)}» — <span class="ph">${phHTML(w[1])}</span> · ${esc(w[2])}${ok?"":`<div class="heard" style="color:var(--ink)">${wordDiff(w[0],r.heard)}</div><div class="small">Your first try counts for the score; retry as much as you like.</div>`}</div>`;
          if(!ok) speak(w[0],true); after(!ok); }); };
      $("#ck",box).onclick=check;
      $("#sh",box).onclick=()=>{ reveal(); speak(w[0]);
        ra.innerHTML=`<button class="btn sm" id="ag">${ICON.play}</button><button class="btn ok" id="yes">✓ I read it right</button><button class="btn bad" id="no">✗ I got it wrong</button>`;
        $("#ag",box).onclick=()=>speak(w[0]);
        $("#yes",box).onclick=()=>{ record(w,true); advance(); }; $("#no",box).onclick=()=>{ record(w,false); advance(); }; };
    } else {
      const opts=shuffle([w,...shuffle(words.filter(x=>x!==w)).slice(0,3)]);
      box.innerHTML=`${header()}<div class="small muted">How is this pronounced?</div><div class="qbig">${stressHTML(w[0])}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-w="${esc(o[0])}"><span class="ph" style="font-size:17px">${phHTML(o[1])}</span></button>`).join("")}</div><div id="fb" style="min-height:50px;margin-top:10px"></div>`;
      let locked=false;
      box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(locked) return; locked=true;
        const ok=b.dataset.w===w[0]; record(w, ok);
        b.classList.add(ok?"right":"wrong"); [...box.querySelectorAll(".opt")].find(x=>x.dataset.w===w[0]).classList.add("right");
        speak(w[0]);
        $("#fb",box).innerHTML=`<div class="row" style="justify-content:space-between"><span><b>${esc(w[2])}</b></span><button class="btn pri sm" id="nx">${i+1>=ROUND?"See my score →":"Next →"}</button></div>`;
        $("#nx",box).onclick=advance;
      });
    }
  }
  start();
}

/* ---------- WRITE ---------- */
let writeTab="trace", traceIdx=0, traceStyle="cursive", traceCase="both";
const PHON = {q:"я",w:"ш",e:"е",r:"р",t:"т",y:"ы",u:"у",i:"и",o:"о",p:"п","[":"ю","]":"щ",a:"а",s:"с",d:"д",f:"ф",g:"г",h:"х",j:"й",k:"к",l:"л",";":"ч","'":"э",z:"з",x:"ж",c:"ц",v:"в",b:"б",n:"н",m:"м","`":"ё","-":"ь","=":"ъ"};
const PHON_REV = Object.fromEntries(Object.entries(PHON).map(([k,v])=>[v,k]));
function vWrite(app){
  app.innerHTML=`<h1>Writing</h1><p class="lead">Russians write by hand in a joined-up script that looks quite different from print. Trace the letters to learn the shapes, then test your spelling with dictation.</p>
  <div class="row" style="margin-bottom:14px"><button class="chip ${writeTab==="trace"?"on":""}" data-t="trace">Trace letters</button><button class="chip ${writeTab==="dict"?"on":""}" data-t="dict">Dictation</button></div>
  <div id="wgoal" style="max-width:640px;margin-bottom:12px"></div>
  <div id="wbox"></div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ writeTab=b.dataset.t; vWrite(app); });
  updWGoal();

}
function updWGoal(){
  const el=$("#wgoal"); if(!el) return; const st=goalState("write");
  el.innerHTML = st.done
    ? `<div class="result good" style="margin:0"><b>✓ 10/10 — writing done for today.</b> You can stop here; extra practice still counts.</div>`
    : `<div class="small muted">Today: <b>${st.val}/${st.n}</b> letters traced or words spelled</div><div class="meter"><i style="width:${st.val/st.n*100}%"></i></div>`;
}
function writeGoalJustDone(){ const d=(S.days[today()]||{}).write; return d && d.done===GOALS.write.n; }
function traceView(box){
  box.innerHTML=`<div class="strip" id="strip">${LETTERS.map((l,i)=>`<button class="${i===traceIdx?"on":""}" data-i="${i}">${l[0]}</button>`).join("")}</div>
  <div class="row" style="margin:8px 0 10px"><button class="chip ${traceStyle==="cursive"?"on":""}" data-s="cursive">Handwriting</button><button class="chip ${traceStyle==="print"?"on":""}" data-s="print">Print</button>
   <span style="width:10px"></span><button class="chip ${traceCase==="both"?"on":""}" data-c="both">Аа</button><button class="chip ${traceCase==="upper"?"on":""}" data-c="upper">А</button><button class="chip ${traceCase==="lower"?"on":""}" data-c="lower">а</button></div>
  <div class="canvas-wrap"><canvas id="cv"></canvas></div>
  <div class="row" style="margin-top:10px;justify-content:space-between">
    <div class="row"><button class="btn sm" id="clr">Clear</button><button class="btn sm" id="gd">Hide guide</button><button class="btn sm" id="snd">${ICON.play} <span class="ru" id="exw"></span></button></div>
    <div class="row"><button class="btn sm" id="pv">← Prev</button><button class="btn pri sm" id="nx">Next →</button></div>
  </div>
  <div class="card small" style="margin-top:14px;line-height:1.9"><b>Handwriting notes.</b> Handwritten <span class="cursive" style="font-size:22px">т</span> looks like an English “m”, <span class="cursive" style="font-size:22px">и</span> like “u”, <span class="cursive" style="font-size:22px">п</span> like “n”, and <span class="cursive" style="font-size:22px">д</span> like “g”. Letters such as л, м and я start with a small hook at the bottom left. Russians often put a line over <span class="cursive" style="font-size:22px">т</span> and under <span class="cursive" style="font-size:22px">ш</span> to tell similar letters apart.</div>`;
  const cv=$("#cv",box), ctx=cv.getContext("2d");
  let strokes=[], cur=null, guide=true;
  const l=LETTERS[traceIdx];
  $("#exw",box).innerHTML=stressHTML(l[5]);
  function size(){ const w=cv.parentElement.clientWidth; const h=Math.round(Math.min(320, Math.max(220,w*0.5))); const dpr=window.devicePixelRatio||1; cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  function draw(){
    const w=cv.clientWidth, h=cv.clientHeight, cs=getComputedStyle(document.documentElement);
    ctx.clearRect(0,0,w,h);
    const base=h*0.74, cap=h*0.18, xh=h*0.42;
    ctx.strokeStyle=cs.getPropertyValue("--line"); ctx.lineWidth=1;
    [cap,xh,base].forEach((y,i)=>{ ctx.setLineDash(i===1?[6,6]:[]); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); });
    ctx.setLineDash([]);
    if(guide){
      const txt = traceCase==="both"? l[0]+" "+l[1] : traceCase==="upper"? l[0] : l[1];
      const fam = traceStyle==="cursive" ? '"Marck Script"' : '"PT Serif"';
      let fs = (base-cap)*1.25; ctx.font=`${fs}px ${fam}`;
      const tw=ctx.measureText(txt).width; if(tw>w*0.9){ fs*=w*0.9/tw; ctx.font=`${fs}px ${fam}`; }
      ctx.fillStyle=cs.getPropertyValue("--muted"); ctx.globalAlpha=0.22; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
      ctx.fillText(txt, w/2, base); ctx.globalAlpha=1;
    }
    ctx.strokeStyle=cs.getPropertyValue("--accent"); ctx.lineWidth=Math.max(5,h/45); ctx.lineCap="round"; ctx.lineJoin="round";
    strokes.forEach(s=>{ ctx.beginPath(); s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(s.length===1) ctx.lineTo(s[0][0]+.1,s[0][1]); ctx.stroke(); });
  }
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); cur=[pos(e)]; strokes.push(cur); draw(); };
  cv.onpointermove=e=>{ if(!cur) return; cur.push(pos(e)); draw(); };
  cv.onpointerup=cv.onpointercancel=()=>{ if(cur){ cur=null; } };
  $("#clr",box).onclick=()=>{ strokes=[]; draw(); };
  $("#gd",box).onclick=e=>{ guide=!guide; e.currentTarget.textContent=guide?"Hide guide":"Show guide"; draw(); };
  $("#snd",box).onclick=()=>speak(l[5]);
  $("#pv",box).onclick=()=>{ traceIdx=(traceIdx+32)%33; traceView(box); };
  $("#nx",box).onclick=()=>{ traceIdx=(traceIdx+1)%33; rec("write", null); updWGoal(); if(writeGoalJustDone()) toast("✓ Writing goal reached — 10/10 for today"); traceView(box); };
  box.querySelectorAll("#strip button").forEach(b=>b.onclick=()=>{ traceIdx=+b.dataset.i; traceView(box); });
  box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ traceStyle=b.dataset.s; traceView(box); });
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ traceCase=b.dataset.c; traceView(box); });
  $("#strip",box).querySelector(".on").scrollIntoView({inline:"center",block:"nearest"});
  size();
  (document.fonts? document.fonts.load('60px "Marck Script"').then(()=>document.fonts.load('60px "PT Serif"')) : Promise.resolve()).then(draw).catch(()=>{});
  window.onresize=()=>{ if(curView==="write"&&writeTab==="trace") size(); };
}

    if(!S.settings.phonetic || e.ctrlKey||e.metaKey||e.altKey) return;
    const k=e.key.toLowerCase(); if(PHON[k]){ e.preventDefault(); const s=inp.selectionStart, en=inp.selectionEnd; let ch=PHON[k]; if(e.key!==k && e.key.length===1) ch=ch.toUpperCase(); inp.value=inp.value.slice(0,s)+ch+inp.value.slice(en); inp.selectionStart=inp.selectionEnd=s+1; }
  });

  function next(){ if(i>=order.length){order=shuffle(words);i=0;} w=order[i++]; answered=false; inp.value=""; $("#fb",box).innerHTML=""; $("#mean",box).textContent=""; $("#nx",box).textContent="Skip →"; speak(w[0]); inp.focus(); $("#sc",box).textContent=tries?`${right}/${tries} correct`:""; }
  function diffHTML(typed, target){ const t=strip(target).toLowerCase(), u=typed.toLowerCase(); return [...t].map((c,k)=>`<span class="${(u[k]===c||(c==="ё"&&u[k]==="е"))?"d-ok":"d-no"}">${esc(c)}</span>`).join(""); }
  function check(){

  $("#pl",box).onclick=()=>speak(w[0]); $("#ps",box).onclick=()=>speak(w[0],true);

  $("#nx",box).onclick=next;
  // first word: wait for click to play audio (browsers need a gesture)
  w=order[i++]; $("#fb",box).innerHTML=`<p class="small muted">Press <b>Listen</b> to hear the first word.</p>`;

      acts.innerHTML=`<button class="btn pri" id="show">Show answer</button>`;
      $("#show",box).onclick=()=>{ revealAnswer(); if(dir==="en") speak(it.ru);
        acts.innerHTML=`<button class="btn bad" data-g="0">Again</button><button class="btn ok" data-g="1">Good</button><button class="btn" data-g="2">Easy</button><span class="small muted">How well did you know it?</span>`;
        acts.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ pending=+b.dataset.g; next(); }); };
      viewKey=null;
    };
    const speakTurn=()=>{
      acts.innerHTML=`<button class="btn acc" id="sp">${ICON.mic} ${attempts?`Try again (${attempts+1} of 3)`:"Speak"}</button>${dir==="en"&&!revealed?`<button class="btn sm" id="dk">I don't know</button>`:""}<button class="btn sm" id="mn">Grade myself</button>`;
      $("#sp",box).onclick=go; $("#mn",box).onclick=manual;
      const dk=$("#dk",box); if(dk) dk.onclick=()=>{ attempts=Math.max(attempts,1); revealAnswer(); speak(it.ru,true); res.innerHTML=`<div class="result mid">Listen, then say it.</div>`; speakTurn(); };
      viewKey=e=>{ if(e.key===" "){ e.preventDefault(); go(); } };
    };
    function go(){
      if(busy) return; busy=true;
      const sp=$("#sp",box); if(sp){ sp.disabled=true; sp.innerHTML=`${ICON.mic} Listening… speak now`; }
      listen(it.ru, r=>{
        busy=false;
        if(r.error){ if(!micOK()){ note(); manual(); } else { res.innerHTML=`<div class="notice w" style="margin-top:10px">${esc(r.error)}</div>`; speakTurn(); } return; }
        attempts++;
        const ok=r.score>=0.85, pct=Math.round(r.score*100);
        rec("speak", ok);
        const line=`<b>${pct}%</b> · heard «${esc(r.heard)}»<div class="heard" style="color:var(--ink)">${wordDiff(it.ru,r.heard)}</div>`;
        if(ok){ res.innerHTML=""; finish(attempts===1 ? (dir==="en"&&r.score>=0.97?2:1) : 0.5, line); return; }
        if(attempts>=3){ res.innerHTML=""; finish(0, line); speak(it.ru,true); return; }
        revealAnswer();
        res.innerHTML=`<div class="result ${pct>=60?"mid":"low"}">${line}<div class="small" style="margin-top:4px">Listen slowly, then try again.</div></div>`;
        speak(it.ru,true); speakTurn();
      }, alts);
    }
    if(micOK()) speakTurn(); else manual();
  }
  show();
}

/* ---------- SETTINGS ---------- */
$("#setBtn").onclick=()=>{
  loadVoices();
  openModal(`<h2 style="margin-top:0">Settings</h2>
   <h3>Russian voice</h3>
   ${voices.length?`<select id="vs">${voices.map(v=>`<option ${getVoice()&&getVoice().name===v.name?"selected":""}>${esc(v.name)}</option>`).join("")}</select>`:voiceNotice()}
   <h3 style="margin-top:16px">Speaking speed</h3>
   <div class="row"><input type="range" id="rt" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}"><span id="rtv">${S.settings.rate}</span><button class="btn sm" id="tst">${ICON.play} Test</button></div>
   <h3 style="margin-top:16px">Display</h3>
   <label class="sw"><input type="checkbox" id="sp" ${S.settings.showPh?"checked":""}> Show pronunciation guide (turn off to force real reading)</label>
   <h3 style="margin-top:16px">Speech checking</h3>
   <p class="small" style="margin:0">${micState==="ok"?"Working.":micState==="unsupported"?MIC_MSG.unsupported:micState==="blocked"?MIC_MSG.blocked:"Not tested yet. Try “Say it & check” on any phrase. On the hosted page the microphone is blocked; the downloadable copy opened in Chrome or Edge supports it."}</p>
   <h3 style="margin-top:16px">Progress</h3>
   <p class="small muted" style="margin:0 0 8px">Saved automatically${cloud.ref?" to your account":" in this browser"}.</p>
   <button class="btn sm bad" id="rs">Reset all progress</button><span id="rsc"></span>`, sh=>{
     const vs=$("#vs",sh); if(vs) vs.onchange=()=>{ S.settings.voice=vs.value; save(); speak("Приве́т! Как дела́?"); };
     $("#rt",sh).oninput=e=>{ S.settings.rate=+e.target.value; $("#rtv",sh).textContent=S.settings.rate; save(); };
     $("#tst",sh).onclick=()=>speak("Здра́вствуйте! Меня́ зову́т Лора́н.");
     $("#sp",sh).onchange=e=>{ S.settings.showPh=e.target.checked; applySettings(); save(); };
     $("#rs",sh).onclick=()=>{ $("#rsc",sh).innerHTML=` <span class="small">Sure? </span><button class="btn sm bad" id="rsy">Yes, reset</button>`; $("#rsy",sh).onclick=()=>{ const keep=S.settings; S=structuredClone(DEFAULT); S.settings=keep; save(); closeModal(); route(); toast("Progress reset."); }; };
  });
};

applySettings(); route(); initCloud();
</script>
